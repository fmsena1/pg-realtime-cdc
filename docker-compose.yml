services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: realtime
      POSTGRES_PASSWORD: realtime
      POSTGRES_DB: realtime
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtime -d realtime"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: go-realtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://realtime:realtime@postgres:5432/realtime?replication=database
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: